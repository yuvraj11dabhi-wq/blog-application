<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Blog - BlogSpace</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <nav class="navbar">
        <div class="logo">BlogSpace</div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
            <a href="dashboard.html">Dashboard</a>
        </div>
    </nav>
</header>

<main>

    <section class="form-section">

        <div class="form-container">

            <h1>Create a New Blog</h1>
            <p>Share your thoughts and ideas with the world.</p>

            <form id="blogForm">

                <label for="blogTitle">Blog Title</label>
                <input
                    type="text"
                    id="blogTitle"
                    placeholder="Enter your blog title"
                    required
                >

                <label for="blogAuthor">Author Name</label>
                <input
                    type="text"
                    id="blogAuthor"
                    placeholder="Enter your name"
                    required
                >

                <label for="blogCategory">Category</label>
                <select id="blogCategory" required>
                    <option value="">Select Category</option>
                    <option value="Technology">Technology</option>
                    <option value="Education">Education</option>
                    <option value="Lifestyle">Lifestyle</option>
                    <option value="Travel">Travel</option>
                    <option value="Other">Other</option>
                </select>

                <label for="blogContent">Blog Content</label>
                <textarea
                    id="blogContent"
                    rows="8"
                    placeholder="Write your blog here..."
                    required
                ></textarea>

                <button type="submit" class="btn">
                    Publish Blog
                </button>

            </form>

        </div>

    </section>

</main>

<footer>
    <p>© 2026 BlogSpace. All Rights Reserved.</p>
</footer>

<script src="script.js"></script>

</body>
      </html>
