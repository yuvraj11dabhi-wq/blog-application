<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - BlogSpace</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <nav class="navbar">
        <div class="logo">BlogSpace</div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
            <a href="dashboard.html">Dashboard</a>
        </div>
    </nav>
</header>

<main>

    <section class="dashboard">
        <div class="dashboard-header">
            <div>
                <h1>My Dashboard</h1>
                <p>Manage your blogs and create new stories.</p>
            </div>

            <a href="create-blog.html" class="btn">
                + Create Blog
            </a>
        </div>

        <div class="blog-container" id="dashboardBlogs">

            <article class="blog-card">
                <h3>Welcome to BlogSpace</h3>
                <p>
                    This is your dashboard. Your created blogs
                    will appear here.
                </p>
                <a href="create-blog.html">Create your first blog →</a>
            </article>

        </div>
    </section>

</main>

<footer>
    <p>© 2026 BlogSpace. All Rights Reserved.</p>
</footer>

<script src="script.js"></script>

</body>
</html>
