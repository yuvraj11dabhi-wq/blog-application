<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - BlogSpace</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <nav class="navbar">
        <div class="logo">BlogSpace</div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="create-blog.html">Create Blog</a>

            <span id="userName" style="color: white; font-weight: bold;">
                User
            </span>

            <button
                onclick="logout()"
                class="btn"
                style="padding: 8px 15px;"
            >
                Logout
            </button>
        </div>
    </nav>
</header>

<main>

    <section class="dashboard">

        <div class="dashboard-header">
            <div>
                <h1>My Dashboard</h1>

                <p>
                    Welcome, <strong id="welcomeName">User</strong>!
                    Manage your blogs and create new stories.
                </p>
            </div>

            <a href="create-blog.html" class="btn">
                + Create Blog
            </a>
        </div>

        <!-- USER PROFILE -->
        <div
            class="blog-card"
            style="margin-bottom: 30px;"
        >
            <h2>User Profile</h2>

            <p>
                <strong>Name:</strong>
                <span id="profileName">Loading...</span>
            </p>

            <p>
                <strong>Email:</strong>
                <span id="profileEmail">Loading...</span>
            </p>
        </div>

        <!-- BLOGS -->
        <div class="blog-container" id="dashboardBlogs">

            <article class="blog-card">
                <h3>Loading your blogs...</h3>
                <p>Please wait while we load your blogs.</p>
            </article>

        </div>

    </section>

</main>

<footer>
    <p>© 2026 BlogSpace. All Rights Reserved.</p>
</footer>

<script src="script.js"></script>

<script>
    // LOAD USER PROFILE
    async function loadProfile() {

        const token = localStorage.getItem("token");

        if (!token) {
            window.location.href = "login.html";
            return;
        }

        try {

            const response = await fetch(
                "https://blog-application-y6dk.onrender.com/api/profile",
                {
                    headers: {
                        "Authorization": `Bearer ${token}`
                    }
                }
            );

            const user = await response.json();

            if (!response.ok) {
                localStorage.removeItem("token");
                localStorage.removeItem("loggedInUser");

                alert(user.message || "Please login again.");

                window.location.href = "login.html";
                return;
            }

            document.getElementById("userName").textContent =
                user.name;

            document.getElementById("welcomeName").textContent =
                user.name;

            document.getElementById("profileName").textContent =
                user.name;

            document.getElementById("profileEmail").textContent =
                user.email;

        } catch (error) {

            console.error("Profile loading error:", error);

            document.getElementById("profileName").textContent =
                "Unable to load";

            document.getElementById("profileEmail").textContent =
                "Unable to load";
        }
    }


    // LOGOUT
    function logout() {

        localStorage.removeItem("token");
        localStorage.removeItem("loggedInUser");

        alert("You have been logged out successfully.");

        window.location.href = "login.html";
    }


    loadProfile();
</script>

</body>
</html>
